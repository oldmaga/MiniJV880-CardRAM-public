#
# minijv880.ini
# Public default configuration for MiniJV880-CardRAM v2.4.0
# features: SR; CARD; PN; SYX; RD-500; NET
#
# This file is provided as a safe public default/example.
# It does not include ROMs, SR-JV80 content, SysEx banks, CardRAM images
# or any other Roland copyrighted sound material.
#
# Network maintenance features are disabled or conservative by default.
# Enable them explicitly only after reviewing the NETWORK section.

# -----------------------------
# CORE
# -----------------------------
MCUcycles=12

# -----------------------------
# SR / EXPANSION
# -----------------------------
# ExpRom is no longer used in this build.
# SR is handled via roms folder + SR overlay (press DATA button).
# Ignored / not used.
#ExpRom=0

# -----------------------------
# AUDIO
# -----------------------------
SoundDevice=i2s
#ChunkSize=256
DACI2CAddress=0
ChannelsSwapped=0

# SampleRate is not used by current build.
# Ignored / not used.
#SampleRate=64000

# -----------------------------
# MIDI
# -----------------------------
MIDIBaudRate=31250

# IgnoreAllNotesOff not used in current build.
# Ignored / not used.
#IgnoreAllNotesOff=0

# MIDIThru not used by current build.
#Ignored / not used.
#MIDIThru=umidi1,ttyS1

# -----------------------------
# LCD (HD44780 compatible)
# -----------------------------
# Recommended setup (this build): HD44780 + I2C backpack (PCF8574 or similar)
#
# I2C pins used:
#   GPIO2 = SDA1
#   GPIO3 = SCL1
#
# If LCDI2CAddress != 0 then LCD runs in I2C mode and all LCDPin* settings are ignored.
# Typical I2C addresses: 0x27 or 0x3F (depends on the backpack).
#
# Display geometry:
# LCDColumns/LCDRows are used by the UI and LCD drivers.
# NOTE (SR overlay build): SR overlay and some debug helpers are developed/tested on 24x2.
# Other HD44780 sizes may work (UI includes scrolling logic), but SR overlay layout is best-effort.

LCDEnabled=1
LCDColumns=24
LCDRows=2

# --- I2C mode (RECOMMENDED / FULLY COMPATIBLE) ---
LCDI2CAddress=0x27

# --- Parallel mode (NO I2C backpack) ---
# ⚠ IMPORTANT LIMITATION
# Direct GPIO wiring of HD44780 is NOT compatible with the 12-button GPIO matrix
# used by this MiniJV880 build, because of GPIO overlap.
#
# Parallel LCD wiring remains usable ONLY if buttons are controlled via MIDI
# (MIDIButton* section) instead of GPIO buttons.
#
# Uncomment ONLY if you are NOT using the 12 GPIO buttons.
#
#LCDI2CAddress=0
#LCDPinEnable=17
#LCDPinRegisterSelect=4
#LCDPinReadWrite=0        # 0 if not connected
#LCDPinData4=22
#LCDPinData5=23
#LCDPinData6=24
#LCDPinData7=25

# -----------------------------
# GPIO BUTTON NAVIGATION
# -----------------------------
# Button actions supported: click and longpress 
# Default (recommended): click for all buttons (see also.
# NOTE1: DATA is reserved for SR overlay toggle (handled via raw edge in CMiniJV880::Process),
# so ButtonActionData is ignored in this build.
# NOTE2: GPIO4 is reserved for debug thru UART-TTL adapter.

ButtonPinPreview=17
ButtonActionPreview=click
ButtonPinLeft=27
ButtonActionLeft=click
ButtonPinRight=22
ButtonActionRight=click
ButtonPinData=12
# Ignored / not used (DATA handled at low level for SR overlay toggle)
ButtonActionData=click
ButtonPinToneSelect=13
ButtonActionToneSelect=click
ButtonPinPatchPerform=23
ButtonActionPatchPerform=click
ButtonPinEdit=24
ButtonActionEdit=click
ButtonPinSystem=5
ButtonActionSystem=click
ButtonPinRhythm=26
ButtonActionRhythm=click
ButtonPinUtility=6
ButtonActionUtility=click
ButtonPinMute=16
ButtonActionMute=click
ButtonPinMonitor=20
ButtonActionMonitor=click
ButtonPinCompare=0
ButtonActionCompare=click
ButtonPinEnter=11
ButtonActionEnter=click

# Not supported in this build (JV-880 layout; SaveNVRAM handled via UI menus)
#ButtonPinUp=
#ButtonActionUp=
#ButtonPinDown=
#ButtonActionDown=
#ButtonPinSaveNVRAM=
#ButtonActionSaveNVRAM=

# -----------------------------
# MIDI BUTTON COMMANDS (optional, supported)
# -----------------------------
# UI buttons can be controlled via MIDI CC messages.
# Useful when you do NOT use GPIO buttons (e.g. to free GPIOs for LCD parallel wiring).
#
# MIDIButtonCh:
#   1-16  = accept commands only on that channel
#   17    = accept commands on any channel (recommended)
MIDIButtonCh=17

MIDIButtonPreview=46
MIDIButtonLeft=47
MIDIButtonRight=48

# IMPORTANT:
# MIDIButtonData generates a normal "DATA" button event,
# but it does NOT toggle the SR overlay.
# SR overlay toggle is bound to the GPIO DATA raw edge only.
MIDIButtonData=49

MIDIButtonToneSelect=50
MIDIButtonPatchPerform=51
MIDIButtonEdit=52
MIDIButtonSystem=53
MIDIButtonRhythm=54
MIDIButtonUtility=55
MIDIButtonMute=56
MIDIButtonMonitor=57
MIDIButtonCompare=58
MIDIButtonEnter=59
#MIDIButtonUp=60
#MIDIButtonDown=61
# MIDISaveNVRAM is not used by this build.
# Ignored / not used.
#MIDISaveNVRAM=56

# -----------------------------
# BUTTON TIMING
# -----------------------------
# Timeouts are only relevant if you use doubleclick/longpress actions.
# With default "click" everywhere, these values do not affect behavior.
DoubleClickTimeout=200
LongPressTimeout=800

#--------------------
# SYX-PN menu
#--------------------
# Long-press ENTER to open the SYX-PN menu
# SysEx files and PN handled via PN-JV80 folder
# Long-press time (milliseconds).
# 1000 ms preserves the current hardcoded behavior.
SYXMenuLongPressTimeout=1000

# Maximum number of .syx files shown inside the currently opened SYX folder.
# SYX subfolders themselves are always shown (subject only to the hard safety cap).
# Recommended: 64 max for usability with the encoder.
SYXMaxFiles=64

# -----------------------------
# ENCODER
# -----------------------------
EncoderEnabled=1
EncoderPinClock=10
EncoderPinData=9

# -----------------------------
# DEBUG
# -----------------------------
ProfileEnabled=1

# MIDIDumpEnabled not used in current build.
# Ignored / not used.
#MIDIDumpEnabled=1

# -----------------------------
# DEBUG SERIAL (bit-bang TX on GPIO4)
# -----------------------------
# This build uses GPIO4 (TX only) to output debug logs via a simple UART-TTL adapter.
# RX is not activated (not required).
#
# Wiring:
#   GPIO4  -> USB-TTL RX
#   GND    -> USB-TTL GND
#   (Do NOT connect 3.3V unless your adapter needs power explicitly.)
#
# Serial parameters:
#   Baud: 38400 (tested)
#   Data bits: 8
#   Parity: None
#   Stop bits: 1
#   Flow control: None
#
# NOTE:
# GPIO14/15 are kept free for an external MIDI interface if needed.
# (Debug serial does NOT use GPIO14/15.)
# Example on Linux:
#   screen /dev/ttyUSB0 38400
# or:
#   minicom -D /dev/ttyUSB0 -b 38400 -8 -o


# -----------------------------
# NETWORK
# -----------------------------
# PUBLIC RELEASE NOTE:
# The defaults below are intentionally conservative.
#
# - DHCP is enabled by default.
# - Static IP fields are neutral placeholders.
# - Write access is disabled by default.
# - TFTP is disabled by default.
# - PN-JV80 and ROM folder exposure are disabled by default.
#
# To use HTTP/TFTP maintenance features, review and edit this section
# for your own local network.

# Network support in this build:
# - small HTTP maintenance server
# - HTTP status / kernel / INI pages
# - HTTP browse for selected SD folders
# - TFTP maintenance channel for kernel and INI staging
#
# Network interface policy (phase 1):
# - use one interface only per boot
# - select it explicitly here
# - HTTP/TFTP use the selected interface only
#
# NOTE:
# Addressing:
# - NetDHCP=0 uses the static address fields below
# - NetDHCP=1 uses DHCP
# - static fields may still be kept here as documentation/reference
#
# Future phase 2 (PROMEMORIA ONLY - NOT ACTIVE):
# - auto mode may later be added with this behavior:
#   1) try ethernet
#   2) if ethernet is not available, try wlan
# - this is only a design reminder for now
# - do NOT rely on it in the current build
#
# Supported values for the planned interface selector:
#   ethernet = prefer wired network
#   wlan     = use Wi-Fi network (NOT STABLE!!)
NetInterface=ethernet

NetEnabled=1
NetDHCP=1
NetIP=0.0.0.0
NetMask=0.0.0.0
NetGateway=0.0.0.0
NetPort=8080
NetHostName=minijv880

# Recommended for conservative operation: keep write access disabled unless needed
# for an explicit maintenance task.
NetWriteEnable=0

# Optional HTTP folder exposure.
# Disabled by default for the public release.
# Enable only after reviewing the files present on your SD card.
NetExposePNJV80=0
NetExposeRoms=0

# TFTP maintenance channel.
# Current implementation can serve kernel8-rpi4.img and minijv880.ini.
# If write support is enabled in the firmware, TFTP writes go to the staging files
# kernel8-rpi4.img.new and minijv880.ini.new.
NetTFTPEnable=0
NetTFTPPort=69
